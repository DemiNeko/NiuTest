<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3863f4">
  <meta name="description" content="Твоя подготовка к любому экзамену: все вопросы, мгновенная проверка, карточки и удобный импорт собственных материалов.">
  <title>NiuTest — твоя подготовка к экзаменам</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/styles.css">
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div id="app"><main class="loading"><img src="./assets/favicon.svg" alt="" width="52" height="52"><h1>NiuTest</h1><p>Загружаем вопросы…</p></main></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="external-change" hidden role="alert"><p>Данные изменились в другой вкладке. Обнови страницу, чтобы продолжить с актуальным прогрессом.</p><a class="button primary" href="">Обновить страницу</a></div>
  <noscript>Для работы тренажёра включите JavaScript в браузере.</noscript>
</body>
</html>
